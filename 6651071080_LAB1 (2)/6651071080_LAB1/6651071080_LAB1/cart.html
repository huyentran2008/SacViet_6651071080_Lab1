<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng | SẮC VIỆT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
  <div class="top-bar">
    <div class="container">
      <div class="top-bar-left"><span>✉ hello@sacviet.vn</span></div>
      <div class="top-bar-right"><a href="contact.html">Liên hệ</a></div>
    </div>
  </div>

  <header class="header">
    <div class="container header-main">
      <a href="index.html" class="logo">
        <div class="logo-icon"><img src="https://images.pexels.com/photos/32202150/pexels-photo-32202150.jpeg?auto=compress&cs=tinysrgb&w=150&h=150&fit=crop" alt="Sắc Việt"></div>
        <div class="logo-text"><h1>SẮC VIỆT</h1><span>Tinh hoa Việt Nam</span></div>
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li><a href="about.html">Giới thiệu</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="cart.html">🛒 <span class="cart-count">0</span></a>
        <span class="cart-total">0₫</span>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2>Giỏ hàng của bạn</h2>
      </div>

      <div id="cart-content">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2025 Sắc Việt. Dự án bài tập – 6651071080.</p>
      </div>
    </div>
  </footer>

  <script src="Scripts/products-data.js"></script>
  <script src="Scripts/main.js"></script>
  <script>
    function renderCart() {
      const cart = Cart.get();
      const content = document.getElementById('cart-content');

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="text-center" style="padding: 60px 20px;">
            <p style="font-size: 18px; margin-bottom: 20px; color: var(--text-muted);">Giỏ hàng của bạn đang trống.</p>
            <a href="products.html" class="btn btn-primary">Tiếp tục mua sắm</a>
          </div>
        `;
        return;
      }

      let rows = cart.map(item => `
        <tr>
          <td>
            <div class="cart-product">
              <img src="${item.image}" alt="${item.name}" onclick="openProductModal('${item.id}')" style="cursor: pointer;" title="Xem ảnh">
              <div>
                <strong onclick="openProductModal('${item.id}')" class="product-name-link" style="cursor: pointer;" title="Xem ảnh">${item.name}</strong><br>
                <small style="color: var(--text-muted);">${item.id}</small>
              </div>
            </div>
          </td>
          <td>${formatPrice(item.price)}</td>
          <td>
            <div class="qty-selector" style="margin:0;">
              <button onclick="updateItemQty('${item.id}', ${item.quantity - 1})">−</button>
              <input type="number" value="${item.quantity}" min="1" style="width:50px;" 
                     onchange="updateItemQty('${item.id}', parseInt(this.value))">
              <button onclick="updateItemQty('${item.id}', ${item.quantity + 1})">+</button>
            </div>
          </td>
          <td><strong>${formatPrice(item.price * item.quantity)}</strong></td>
          <td>
            <button class="btn btn-outline" style="padding:6px 12px; font-size:13px;" 
                    onclick="removeItem('${item.id}')">Xóa</button>
          </td>
        </tr>
      `).join('');

      content.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Đơn giá</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>

        <div class="cart-summary">
          <h3>Tóm tắt đơn hàng</h3>
          <div class="summary-row">
            <span>Tạm tính</span>
            <span>${formatPrice(Cart.getTotal())}</span>
          </div>
          <div class="summary-row">
            <span>Phí vận chuyển</span>
            <span>Miễn phí</span>
          </div>
          <div class="summary-row total">
            <span>Tổng cộng</span>
            <span>${formatPrice(Cart.getTotal())}</span>
          </div>
          <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
            <button class="btn btn-primary" onclick="checkout()">Tiến hành đặt hàng</button>
            <a href="products.html" class="btn btn-outline">Tiếp tục mua sắm</a>
          </div>
        </div>
      `;
    }

    function updateItemQty(id, qty) {
      if (qty < 1) {
        removeItem(id);
        return;
      }
      Cart.updateQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      Cart.remove(id);
      renderCart();
    }

    function checkout() {
      if (Cart.get().length === 0) return;
      showToast('Cảm ơn bạn! Đơn hàng đã được ghi nhận (demo).');
      Cart.clear();
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
